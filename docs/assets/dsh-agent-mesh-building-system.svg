<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">把多个 coding CLI 接进一个 DSH 对话</title>
  <desc id="desc">A structured public-system poster showing DSH, Agent Mesh, and native coding harnesses connected as a working system.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 3H18M0 12H18" stroke="#163B72" stroke-opacity=".045" stroke-width="1"/>
      <circle cx="4" cy="8" r=".7" fill="#D9342B" fill-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="#E7D3A9"/>
  <rect x="20" y="20" width="860" height="1160" fill="none" stroke="#11151C" stroke-width="3"/>
  <rect x="24" y="24" width="852" height="1152" fill="url(#paper)"/>

  <!-- Functional text field: short, exact, and readable at thumbnail size. -->
  <g fill="#163B72" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <text x="64" y="74" font-size="22" letter-spacing="4">DSH / AGENT MESH</text>
    <text x="64" y="106" font-size="16" letter-spacing="3" fill="#7C3028">PUBLIC SYSTEM / LOCAL WORKFLOW</text>
    <text x="64" y="242" font-size="72" font-weight="700">把多个</text>
    <text x="64" y="332" font-size="78" font-weight="800" fill="#D9342B">coding CLI</text>
    <text x="64" y="414" font-size="66" font-weight="700">接进一个</text>
    <text x="64" y="492" font-size="66" font-weight="700">DSH 对话</text>
  </g>

  <g fill="#11151C" font-family="IBM Plex Mono, Menlo, monospace" font-size="17" letter-spacing="2">
    <text x="64" y="594">SELECT · RESUME</text>
    <text x="64" y="622">HANDOFF · ROUTE</text>
    <text x="64" y="682">NO SECOND COMPOSER</text>
    <text x="64" y="710">NO CREDENTIAL COPY</text>
  </g>

  <!-- One public-system silhouette: five offset platforms, not a card grid. -->
  <g stroke="#11151C" stroke-width="3" stroke-linejoin="miter">
    <path d="M454 220H846L818 270H430Z" fill="#163B72"/>
    <path d="M430 342H824L792 392H404Z" fill="#2E6C9E"/>
    <path d="M472 464H846L808 514H438Z" fill="#7C3028"/>
    <path d="M440 586H796L762 636H406Z" fill="#E9B83F"/>
    <path d="M486 708H848L806 758H452Z" fill="#163B72"/>

    <path d="M508 182V756M620 218V756M742 260V756" fill="none" stroke="#E25C2C" stroke-width="13"/>
    <path d="M466 246L788 726" fill="none" stroke="#D9342B" stroke-width="4"/>
    <circle cx="466" cy="246" r="9" fill="#D9342B"/>
    <circle cx="788" cy="726" r="9" fill="#D9342B"/>
  </g>

  <g fill="#F3EBDD" font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">
    <text x="478" y="252">DSH / 原生会话</text>
    <text x="448" y="374">MESH / 发现与映射</text>
    <text x="482" y="496" fill="#F3EBDD">HANDOFF / 交接</text>
    <text x="452" y="618" fill="#11151C">ROUTE / 有边界协作</text>
    <text x="500" y="740">NATIVE / CLI</text>
  </g>

  <!-- Small users/tools prove that the system is used; they are not heroic figures. -->
  <g fill="#11151C">
    <circle cx="548" cy="204" r="8"/><rect x="540" y="214" width="16" height="22"/>
    <circle cx="700" cy="326" r="8"/><rect x="692" y="336" width="16" height="22"/>
    <circle cx="560" cy="448" r="8"/><rect x="552" y="458" width="16" height="22"/>
    <circle cx="720" cy="570" r="8"/><rect x="712" y="580" width="16" height="22"/>
    <circle cx="580" cy="692" r="8"/><rect x="572" y="702" width="16" height="22"/>
  </g>
  <g fill="#F3EBDD" stroke="#11151C" stroke-width="2">
    <rect x="590" y="210" width="34" height="21"/>
    <rect x="740" y="330" width="34" height="21"/>
    <rect x="602" y="452" width="34" height="21"/>
    <rect x="760" y="574" width="34" height="21"/>
    <rect x="624" y="696" width="34" height="21"/>
  </g>

  <!-- Geographic / production foundation. -->
  <path d="M24 870L150 790L264 854L382 760L520 850L642 782L876 858V1176H24Z" fill="#2E6C9E" stroke="#11151C" stroke-width="3"/>
  <path d="M24 932L172 850L292 914L404 832L550 918L680 848L876 936V1176H24Z" fill="#163B72" fill-opacity=".72"/>
  <path d="M24 1010H876" stroke="#E9B83F" stroke-width="11"/>
  <path d="M90 1112C252 1054 390 1068 520 1110C644 1150 746 1146 876 1086" fill="none" stroke="#F3EBDD" stroke-width="8"/>
  <path d="M24 1140H876" stroke="#11151C" stroke-width="3"/>

  <g fill="#F3EBDD" font-family="IBM Plex Mono, Menlo, monospace" font-size="17" letter-spacing="2">
    <text x="64" y="1148">LOCAL CONTROL PLANE</text>
    <text x="676" y="1148">MIT / NODE 18+</text>
  </g>
</svg>
